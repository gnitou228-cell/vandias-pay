<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 75" width="120" height="75" fill="none">
  <!-- Card Background -->
  <rect width="120" height="75" rx="12" fill="#0A2540"/>
  <!-- Subtle Sapphire Gradient Accent -->
  <rect x="0" y="0" width="120" height="75" rx="12" fill="url(#cardGrad)" opacity="0.6"/>
  <!-- Gold Chip -->
  <rect x="14" y="14" width="18" height="14" rx="3" fill="#F59E0B" stroke="#D97706" stroke-width="1"/>
  <line x1="20" y1="14" x2="20" y2="28" stroke="#D97706" stroke-width="1"/>
  <line x1="26" y1="14" x2="26" y2="28" stroke="#D97706" stroke-width="1"/>
  <line x1="14" y1="21" x2="32" y2="21" stroke="#D97706" stroke-width="1"/>
  <!-- Contactless wave -->
  <path d="M40 18 C43 20, 43 23, 40 25" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M43 15 C47 19, 47 24, 43 28" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  
  <!-- Mastercard circles (Right bottom) -->
  <g transform="translate(68, 38)">
    <circle cx="16" cy="16" r="14" fill="#EB001B"/>
    <circle cx="32" cy="16" r="14" fill="#F79E1B" fill-opacity="0.92"/>
  </g>
  <!-- Visa Text (Left bottom) -->
  <g transform="translate(14, 45)">
    <text x="0" y="18" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-style="italic" font-size="19" fill="#FFFFFF" letter-spacing="0.5">VISA</text>
  </g>

  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="120" y2="75" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0052FF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0A2540" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
</svg>